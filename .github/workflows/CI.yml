name: CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: VulkanSDK
          key: VulkanSDK-1.3.280.0-windows

      - name: Install Vulkan SDK
        if: steps.cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://sdk.lunarg.com/sdk/download/1.3.280.0/windows/VulkanSDK-1.3.280.0-Installer.exe -OutFile VulkanSDK.exe
          7z x -aoa ./VulkanSDK.exe -oVulkanSDK

      - name: Build
        shell: pwsh
        run: |
          $env:VULKAN_SDK="$(pwd)/VulkanSDK"
          cmake -S src -B build -A x64
          cmake --build build --config Release --parallel


  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: vulkansdk
          key: VulkanSDK-1.3.280.0-linux

      - name: Install Vulkan SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.3.280.0/linux/vulkansdk-linux-x86_64-1.3.280.0.tar.gz -O sdk.tar.gz
          mkdir vulkansdk
          tar -xf sdk.tar.gz -C vulkansdk --strip-components=1

      - name: Build
        run: |
          export VULKAN_SDK=$PWD/vulkansdk/x86_64
          cmake -S src -B build
          cmake --build build --parallel


  macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache Vulkan SDK
        uses: actions/cache@v4
        with:
          path: vulkansdk
          key: VulkanSDK-1.3.280.0-macos

      - name: Install Vulkan SDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          wget https://sdk.lunarg.com/sdk/download/1.3.280.0/mac/vulkansdk-macos-1.3.280.0.dmg -O sdk.dmg
          hdiutil attach sdk.dmg
          cp -r /Volumes/vulkansdk-macos-* vulkansdk
          hdiutil detach /Volumes/vulkansdk-macos-*

      - name: Build x86_64
        run: |
          export VULKAN_SDK=$PWD/vulkansdk/macOS
          cmake -S src -B build-x86 \
            -DCMAKE_OSX_ARCHITECTURES="x86_64" \
            -DUSE_STATIC_MOLTENVK=ON \
            -DVulkan_INCLUDE_DIR=$PWD/vulkansdk/MoltenVK/include \
            -DVulkan_LIBRARY=$PWD/vulkansdk/MoltenVK/MoltenVK.xcframework/macos-arm64_x86_64/libMoltenVK.a
          cmake --build build-x86 --parallel

      - name: Build arm64
        run: |
          export VULKAN_SDK=$PWD/vulkansdk/macOS
          cmake -S src -B build-arm \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DUSE_STATIC_MOLTENVK=ON \
            -DVulkan_INCLUDE_DIR=$PWD/vulkansdk/MoltenVK/include \
            -DVulkan_LIBRARY=$PWD/vulkansdk/MoltenVK/MoltenVK.xcframework/macos-arm64_x86_64/libMoltenVK.a
          cmake --build build-arm --parallel
